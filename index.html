<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zohirola – Download the Android app</title>
<meta name="description" content="Zohirola: Gemini, Claude, GPT and DeepSeek in one chat. Voice chat, 20+ AI tools, Bangla and English. Download the Android app.">
<meta name="theme-color" content="#d9261c">
<meta property="og:title" content="Zohirola – Download the Android app">
<meta property="og:description" content="Gemini, Claude, GPT and DeepSeek in one chat. Bangla and English.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='136 121 1650 1650'%3E%3Cg fill='%23d7231c'%3E%3Cpath d='M1643,625H800C745,625 705,660 705,710V825C705,880 750,912 805,912H1723A765,765 0 0 1 1718,1070H1085C850,1070 702,1200 702,1420V1690A765,765 0 1 1 1643,625Z'/%3E%3Cpath d='M1010,1519V1440C1010,1390 1050,1352 1100,1352H1620A765,765 0 0 1 1490,1518Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Noto+Sans+Bengali:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    color-scheme: light dark;
    box-sizing: border-box;
    --bg:#faf8f7; --card:#ffffff; --text:#17141a; --muted:#6a6472; --line:rgba(23,20,26,.09);
    --red:#d9261c; --red2:#ff6a4d; --soft:rgba(217,38,28,.08); --shadow:0 18px 50px -20px rgba(60,20,20,.25);
    --glass:rgba(250,248,247,.78);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e0d11; --card:#17161c; --text:#f5f3f7; --muted:#a8a2b3; --line:rgba(255,255,255,.1);
      --soft:rgba(255,106,77,.13); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --glass:rgba(14,13,17,.78);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e0d11; --card:#17161c; --text:#f5f3f7; --muted:#a8a2b3; --line:rgba(255,255,255,.1);
    --soft:rgba(255,106,77,.13); --shadow:0 18px 50px -20px rgba(0,0,0,.7); --glass:rgba(14,13,17,.78);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;scroll-padding-top:76px}
  html,body{margin:0}
  body{
    background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden;
    font-family:"DM Sans","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html[lang=bn] body{font-family:"Noto Sans Bengali","DM Sans",system-ui,sans-serif}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  section{padding:64px 0}
  h1,h2,h3{line-height:1.2;margin:0}
  h2{font-size:clamp(26px,4.2vw,38px);font-weight:800;letter-spacing:-.01em}
  .eyebrow{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--red);background:var(--soft);padding:6px 12px;border-radius:99px;margin-bottom:14px}
  .lead{color:var(--muted);font-size:17px;max-width:620px;margin:12px 0 0}
  .center{text-align:center}.center .lead{margin-left:auto;margin-right:auto}

  /* soft moving backdrop */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.32;display:block}
  .bg i:nth-child(1){width:360px;height:360px;left:-110px;top:-80px;background:#ff6a4d;animation:d1 16s ease-in-out infinite}
  .bg i:nth-child(2){width:320px;height:320px;right:-110px;top:260px;background:#8a78ff;animation:d2 19s ease-in-out infinite}
  .bg i:nth-child(3){width:300px;height:300px;left:30%;bottom:-120px;background:#d9261c;animation:d1 22s ease-in-out infinite reverse}
  @keyframes d1{50%{transform:translate(60px,70px) scale(1.12)}}
  @keyframes d2{50%{transform:translate(-70px,50px) scale(.9)}}

  /* top bar */
  .top{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .top .wrap{display:flex;align-items:center;gap:10px;height:62px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none}
  .brand svg{width:30px;height:30px}
  .nav{display:none;margin-left:22px;gap:6px}
  .nav a{font-size:14.5px;font-weight:500;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:10px}
  .nav a:hover{background:var(--soft);color:var(--text)}
  .sp{flex:1}
  .icon-btn{height:38px;min-width:38px;padding:0 11px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--text);font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn:active{transform:scale(.96)}
  @media(min-width:860px){.nav{display:flex}}

  /* buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;
    font:inherit;font-weight:700;font-size:16px;border-radius:16px;padding:15px 24px;transition:transform .15s, box-shadow .2s}
  .btn svg{width:20px;height:20px;flex:none}
  .btn:active{transform:scale(.97)}
  .btn-red{color:#fff;background:linear-gradient(135deg,var(--red),var(--red2));box-shadow:0 14px 30px -12px rgba(217,38,28,.7)}
  .btn-red:hover{box-shadow:0 18px 36px -12px rgba(217,38,28,.85)}
  .btn-ghost{color:var(--text);background:var(--card);border:1px solid var(--line)}
  .btn-sm{padding:9px 15px;font-size:14px;border-radius:12px}

  /* hero */
  .hero{padding:44px 0 36px}
  .hero-grid{display:grid;gap:34px;align-items:center}
  @media(min-width:900px){.hero-grid{grid-template-columns:1.1fr .9fr}.hero{padding:70px 0 50px}}
  .logo-draw{width:84px;height:84px;margin-bottom:18px;display:block}
  .shape{fill:var(--red);fill-opacity:0;stroke:var(--red);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
  .play .shape{animation:show 0s linear forwards,draw var(--d) cubic-bezier(.5,0,.3,1) forwards,fill .7s ease-out forwards;
    animation-delay:var(--t),var(--t),var(--f)}
  @keyframes show{to{opacity:1}} @keyframes draw{to{stroke-dashoffset:0}} @keyframes fill{to{fill-opacity:1}}
  h1{font-size:clamp(34px,6.4vw,58px);font-weight:800;letter-spacing:-.02em}
  h1 em{font-style:normal;background:linear-gradient(135deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.sub{font-size:clamp(16px,2.2vw,19px);color:var(--muted);max-width:560px;margin:18px 0 0}
  .cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .verline{margin-top:14px;font-size:13.5px;color:var(--muted);min-height:22px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{font-size:13px;font-weight:500;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .notice{display:none;margin-top:18px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;max-width:560px}
  .notice.show{display:block}
  .notice button{margin-top:8px}

  /* phone mock */
  .phone-wrap{display:flex;justify-content:center}
  .phone{width:min(300px,82vw);aspect-ratio:9/18.4;border-radius:38px;padding:9px;background:linear-gradient(160deg,#2a2730,#0d0c10);
    box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.06) inset;position:relative}
  .screen{height:100%;border-radius:30px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
  .scr-top{padding:16px 14px 10px;border-bottom:1px solid var(--line);background:var(--card)}
  .scr-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
  .scr-title svg{width:18px;height:18px}
  .svc{display:flex;gap:5px;margin-top:9px}
  .svc span{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:5px 0;border-radius:99px;border:1px solid var(--line);color:var(--muted);transition:all .3s}
  .svc span.on{background:var(--red);border-color:var(--red);color:#fff}
  .msgs{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:9px;overflow:hidden;justify-content:flex-end}
  .msg{max-width:86%;padding:9px 12px;border-radius:16px;font-size:12.5px;line-height:1.5;animation:pop .3s ease-out}
  .msg.u{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-bottom-right-radius:5px}
  .msg.b{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
  .msg.sw{align-self:center;font-size:10.5px;color:var(--muted);background:var(--soft);border-radius:99px;padding:5px 11px}
  .dots{display:inline-flex;gap:4px;padding:4px 0}
  .dots b{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1s infinite ease-in-out}
  .dots b:nth-child(2){animation-delay:.15s}.dots b:nth-child(3){animation-delay:.3s}
  @keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
  .scr-in{margin:8px 10px 12px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .scr-in i{margin-left:auto;width:22px;height:22px;border-radius:50%;background:var(--red);display:block}

  /* stats */
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 16px;text-align:center}
  .stat b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(135deg,var(--red),var(--red2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat span{font-size:13.5px;color:var(--muted)}

  /* features */
  .grid{display:grid;gap:14px;margin-top:34px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:980px){.grid{grid-template-columns:repeat(3,1fr)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;transition:transform .2s, box-shadow .2s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--red);margin-bottom:14px}
  .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:18px;font-weight:700}
  .card p{margin:8px 0 0;color:var(--muted);font-size:15px}

  /* tools */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
  .tab{font:inherit;font-size:14px;font-weight:700;padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
  .tab.on{background:var(--red);border-color:var(--red);color:#fff}
  .tools{display:grid;gap:10px;margin-top:18px}
  @media(min-width:760px){.tools{grid-template-columns:repeat(2,1fr)}}
  .tool{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px}
  .tool .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--red);font-weight:800;font-size:13px;display:grid;place-items:center}
  .tool b{display:block;font-size:15.5px}
  .tool span{font-size:13.5px;color:var(--muted)}

  /* install */
  .steps{display:grid;gap:14px;margin-top:34px;counter-reset:s}
  @media(min-width:820px){.steps{grid-template-columns:repeat(3,1fr)}}
  .step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;position:relative}
  .step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;
    background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:800;margin-bottom:14px}
  .step h3{font-size:18px}.step p{margin:8px 0 0;color:var(--muted);font-size:15px}
  .tip{margin-top:18px;padding:16px 18px;border-radius:18px;background:var(--soft);font-size:14.5px}

  /* faq */
  .faq{max-width:760px;margin:30px auto 0;display:grid;gap:10px}
  details{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 18px}
  summary{cursor:pointer;list-style:none;font-weight:700;padding:16px 0;display:flex;justify-content:space-between;gap:12px;font-size:16px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--red);font-size:22px;line-height:1;transition:transform .2s}
  details[open] summary::after{transform:rotate(45deg)}
  details p{margin:0 0 16px;color:var(--muted);font-size:15px}

  /* final cta + footer */
  .final{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-radius:30px;padding:46px 24px;text-align:center;box-shadow:0 30px 60px -28px rgba(217,38,28,.7)}
  .final h2{color:#fff}.final p{margin:12px auto 24px;max-width:520px;opacity:.92}
  .final .btn{background:#fff;color:var(--red);box-shadow:none}
  footer{padding:30px 0 46px;color:var(--muted);font-size:14px;text-align:center;border-top:1px solid var(--line)}
  footer b{color:var(--text)}

  .reveal{opacity:0;transform:translateY(18px);transition:opacity .6s, transform .6s}
  .reveal.in{opacity:1;transform:none}
  @media(prefers-reduced-motion:reduce){
    .shape{stroke-dashoffset:0!important;opacity:1!important;fill-opacity:1!important;animation:none!important}
    .reveal{opacity:1;transform:none;transition:none}
    .bg i{animation:none}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Zohirola">
      <svg viewBox="136 121 1650 1650" aria-hidden="true"><g fill="#d7231c">
        <path d="M1643,625H800C745,625 705,660 705,710V825C705,880 750,912 805,912H1723A765,765 0 0 1 1718,1070H1085C850,1070 702,1200 702,1420V1690A765,765 0 1 1 1643,625Z"/>
        <path d="M1010,1519V1440C1010,1390 1050,1352 1100,1352H1620A765,765 0 0 1 1490,1518Z"/></g></svg>
      <span class="appname">Zohirola</span>
    </a>
    <nav class="nav">
      <a href="#features" data-i="navFeatures"></a>
      <a href="#tools" data-i="navTools"></a>
      <a href="#install" data-i="navInstall"></a>
      <a href="#faq" data-i="navFaq"></a>
    </nav>
    <span class="sp"></span>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="icon-btn" id="langBtn" type="button" aria-label="Language">EN</button>
    <a class="btn btn-red btn-sm dl-link" href="#" data-i="dlShort"></a>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <svg id="logoDraw" class="logo-draw play" viewBox="136 121 1650 1650" role="img" aria-label="Zohirola logo">
          <path class="shape" pathLength="1" style="--t:.2s;--d:1.8s;--f:1.8s"
            d="M1643,625H800C745,625 705,660 705,710V825C705,880 750,912 805,912H1723A765,765 0 0 1 1718,1070H1085C850,1070 702,1200 702,1420V1690A765,765 0 1 1 1643,625Z"/>
          <path class="shape" pathLength="1" style="--t:1.3s;--d:.6s;--f:1.9s"
            d="M1010,1519V1440C1010,1390 1050,1352 1100,1352H1620A765,765 0 0 1 1490,1518Z"/>
        </svg>
        <span class="eyebrow" data-i="heroTag"></span>
        <h1 data-i="heroTitle"></h1>
        <p class="sub" data-i="heroSub"></p>
        <div class="cta">
          <a class="btn btn-red dl-link" href="#" id="mainDl">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span data-i="dlMain"></span>
          </a>
          <a class="btn btn-ghost" href="#install" data-i="howInstall"></a>
        </div>
        <div class="verline" id="verLine"></div>
        <div class="chips">
          <span class="chip" data-i="chip1"></span><span class="chip" data-i="chip2"></span><span class="chip" data-i="chip3"></span>
        </div>
        <div class="notice" id="desktopNote">
          <span data-i="desktopNote"></span><br>
          <button class="btn btn-ghost btn-sm" id="copyLink" type="button" data-i="copyLink"></button>
        </div>
      </div>

      <div class="phone-wrap" aria-hidden="true">
        <div class="phone"><div class="screen">
          <div class="scr-top">
            <div class="scr-title">
              <svg viewBox="136 121 1650 1650"><g fill="#d7231c"><path d="M1643,625H800C745,625 705,660 705,710V825C705,880 750,912 805,912H1723A765,765 0 0 1 1718,1070H1085C850,1070 702,1200 702,1420V1690A765,765 0 1 1 1643,625Z"/><path d="M1010,1519V1440C1010,1390 1050,1352 1100,1352H1620A765,765 0 0 1 1490,1518Z"/></g></svg>
              Zohirola
            </div>
            <div class="svc" id="svc"><span class="on">Gemini</span><span>Claude</span><span>GPT</span><span>DeepSeek</span></div>
          </div>
          <div class="msgs" id="msgs"></div>
          <div class="scr-in"><span data-i="demoInput"></span><i></i></div>
        </div></div>
      </div>
    </div>
  </section>

  <!-- STATS -->
  <div class="wrap reveal">
    <div class="stats">
      <div class="stat"><b>4</b><span data-i="stat1"></span></div>
      <div class="stat"><b>20+</b><span data-i="stat2"></span></div>
      <div class="stat"><b>2</b><span data-i="stat3"></span></div>
      <div class="stat"><b>24/7</b><span data-i="stat4"></span></div>
    </div>
  </div>

  <!-- FEATURES -->
  <section id="features">
    <div class="wrap center">
      <span class="eyebrow" data-i="featEyebrow"></span>
      <h2 data-i="featTitle"></h2>
      <p class="lead" data-i="featLead"></p>
      <div class="grid" id="featGrid" style="text-align:left"></div>
    </div>
  </section>

  <!-- TOOLS -->
  <section id="tools">
    <div class="wrap">
      <div class="center">
        <span class="eyebrow" data-i="toolsEyebrow"></span>
        <h2 data-i="toolsTitle"></h2>
        <p class="lead" data-i="toolsLead"></p>
      </div>
      <div class="tabs" id="toolTabs" style="justify-content:center"></div>
      <div class="tools" id="toolList"></div>
    </div>
  </section>

  <!-- INSTALL -->
  <section id="install">
    <div class="wrap">
      <div class="center">
        <span class="eyebrow" data-i="instEyebrow"></span>
        <h2 data-i="instTitle"></h2>
        <p class="lead" data-i="instLead"></p>
      </div>
      <div class="steps">
        <div class="step"><h3 data-i="st1h"></h3><p data-i="st1p"></p></div>
        <div class="step"><h3 data-i="st2h"></h3><p data-i="st2p"></p></div>
        <div class="step"><h3 data-i="st3h"></h3><p data-i="st3p"></p></div>
      </div>
      <div class="tip" data-i="instTip"></div>
    </div>
  </section>

  <!-- FAQ -->
  <section id="faq">
    <div class="wrap">
      <div class="center">
        <span class="eyebrow" data-i="faqEyebrow"></span>
        <h2 data-i="faqTitle"></h2>
      </div>
      <div class="faq" id="faqList"></div>
    </div>
  </section>

  <!-- FINAL CTA -->
  <section style="padding-top:20px">
    <div class="wrap">
      <div class="final">
        <h2 data-i="finalTitle"></h2>
        <p data-i="finalSub"></p>
        <a class="btn dl-link" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M
